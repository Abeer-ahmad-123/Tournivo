name: Verify Tournivo
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: tournivo_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres@127.0.0.1:5432/tournivo_test
      TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/tournivo_test
      BETTER_AUTH_URL: http://localhost:3000
      EVIDENCE_DRIVER: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate ephemeral test authentication secret
        run: node -e 'require("node:fs").appendFileSync(process.env.GITHUB_ENV, "BETTER_AUTH_SECRET=" + require("node:crypto").randomBytes(48).toString("base64url") + "\n")'
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run format:check
      - run: npm run check
      - run: npm run test:integration
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build
      - run: npm audit --audit-level=moderate
